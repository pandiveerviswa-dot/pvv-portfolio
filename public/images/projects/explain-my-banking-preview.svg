    <text x="260" y="154" font-family="'Space Mono', monospace" font-size="10" font-weight="bold" fill="#F43F5E">₹1,450</text>

    <!-- Tx 3 -->
    <rect x="15" y="185" width="320" height="52" fill="#121620" stroke="#222838" stroke-width="1"/>
    <text x="25" y="205" font-family="'Space Mono', monospace" font-size="9.5" fill="#FFFFFF">RideWave Mobility</text>
    <text x="25" y="222" font-family="'Space Mono', monospace" font-size="8" fill="#586073">Sep 18 • Transport • Rides</text>
    <text x="260" y="214" font-family="'Space Mono', monospace" font-size="10" font-weight="bold" fill="#F43F5E">₹650</text>

