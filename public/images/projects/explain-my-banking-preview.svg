    <text x="25" y="272" font-family="'Space Mono', monospace" font-size="8.5" font-weight="bold" fill="#CCFF00">CUSTOMER DECISION STAGE</text>
    <text x="25" y="290" font-family="'Space Mono', monospace" font-size="8" fill="#FFFFFF">Clear explanation gives customer confidence.</text>
    <text x="25" y="306" font-family="'Space Mono', monospace" font-size="7.5" fill="#848D9F">Actions: Set budget limit • Tag one-off • Review</text>
    <text x="25" y="322" font-family="'Space Mono', monospace" font-size="7.5" fill="#10B981">LIVE PROTOTYPE: explain-my-banking.vercel.app</text>
