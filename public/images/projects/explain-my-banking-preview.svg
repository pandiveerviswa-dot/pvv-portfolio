    <text x="35" y="283" font-family="'Space Mono', monospace" font-size="11" font-weight="bold" fill="#FFFFFF">Other</text>
    <text x="35" y="300" font-family="'Space Mono', monospace" font-size="8.5" fill="#848D9F">Annual subscriptions &amp; fees</text>
    <text x="350" y="293" font-family="'Syne', sans-serif" font-size="16" font-weight="bold" fill="#F43F5E">+₹1,300</text>

    <text x="20" y="335" font-family="'Space Mono', monospace" font-size="8.5" fill="#10B981">TOTAL ATTRIBUTED VARIANCE: ₹8,400 (100% RECONCILED)</text>
